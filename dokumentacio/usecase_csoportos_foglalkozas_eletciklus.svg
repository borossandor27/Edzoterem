<svg width="900" height="780" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Use case diagram – Csoportos foglalkozás életciklusa a jóváhagyástól a lezárásig</title>
<desc>A tulajdonos jóváhagyja a meghirdetett csoportos foglalkozást, ezután a recepciós tagokat jelentkeztethet rá a létszámkorlát ellenőrzése mellett, majd az edző a foglalkozás napján rögzíti a jelenlétet, ami után a foglalkozás lezárásra kerül.</desc>
<defs>
  <marker id="openArrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="black" stroke-width="1.2"/>
  </marker>
</defs>

<text x="450" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="black">Use case diagram – Csoportos foglalkozás életciklusa (jóváhagyástól a lezárásig)</text>

<rect x="200" y="55" width="640" height="670" rx="6" fill="none" stroke="black" stroke-width="1.5"/>
<text x="215" y="78" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="black">Csoportos foglalkozás – életciklus</text>
<text x="215" y="96" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">(előzmény: az edző meghirdette a foglalkozást – ld. előző ábra)</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="112" r="12" fill="white"/>
  <line x1="90" y1="124" x2="90" y2="160"/>
  <line x1="72" y1="135" x2="108" y2="135"/>
  <line x1="90" y1="160" x2="72" y2="190"/>
  <line x1="90" y1="160" x2="108" y2="190"/>
</g>
<text x="90" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Tulajdonos</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="302" r="12" fill="white"/>
  <line x1="90" y1="314" x2="90" y2="350"/>
  <line x1="72" y1="325" x2="108" y2="325"/>
  <line x1="90" y1="350" x2="72" y2="380"/>
  <line x1="90" y1="350" x2="108" y2="380"/>
</g>
<text x="90" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Recepciós</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="532" r="12" fill="white"/>
  <line x1="90" y1="544" x2="90" y2="580"/>
  <line x1="72" y1="555" x2="108" y2="555"/>
  <line x1="90" y1="580" x2="72" y2="610"/>
  <line x1="90" y1="580" x2="108" y2="610"/>
</g>
<text x="90" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Edző</text>

<line x1="108" y1="135" x2="240" y2="150" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="325" x2="230" y2="330" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="555" x2="248" y2="485" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="570" x2="243" y2="660" stroke="black" stroke-width="1.2"/>

<ellipse cx="380" cy="150" rx="140" ry="48" fill="white" stroke="black" stroke-width="1.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">
  <tspan x="380" y="145">Csoportos foglalkozás</tspan>
  <tspan x="380" y="163">jóváhagyása</tspan>
</text>

<ellipse cx="380" cy="330" rx="150" ry="50" fill="white" stroke="black" stroke-width="1.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">
  <tspan x="380" y="325">Tag jelentkeztetése</tspan>
  <tspan x="380" y="343">foglalkozásra</tspan>
</text>

<ellipse cx="690" cy="330" rx="120" ry="42" fill="white" stroke="black" stroke-width="1.5"/>
<text x="690" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Létszámkorlát ellenőrzése</text>

<ellipse cx="380" cy="500" rx="140" ry="46" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Jelenlét rögzítése</text>

<ellipse cx="380" cy="650" rx="140" ry="46" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Foglalkozás lezárása</text>
<text x="380" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">állapot: megtartva / lezárva</text>

<path d="M515,310 L575,316" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow3)"/>
<text x="545" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«include»</text>

<path d="M405,281 L405,197" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow3)"/>
<text x="452" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«extend»</text>

<path d="M405,455 L405,379" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow3)"/>
<text x="452" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«extend»</text>

<path d="M405,545 L405,605" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow3)"/>
<text x="452" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«include»</text>

<text x="450" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="black">«include» = mindig lefut · «extend» = az előző lépés eredményétől függően folytatódik a folyamat</text>
</svg>
