<svg width="920" height="630" viewBox="0 0 920 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Use case diagram – Tag regisztrálása</title>
<desc>A tulajdonos és a recepciós regisztrálhat új tagot; a regisztráció magába foglalja az alapadatok és a vészhelyzeti kapcsolattartó rögzítését, és opcionálisan kiterjeszthető a bérlet hozzárendelésével.</desc>
<defs>
  <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="black" stroke-width="1.2"/>
  </marker>
</defs>

<text x="460" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="black">Use case diagram – Tag regisztrálása</text>

<rect x="200" y="55" width="700" height="525" rx="6" fill="none" stroke="black" stroke-width="1.5"/>
<text x="215" y="80" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="black">Tagnyilvántartó rendszer</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="80" cy="122" r="12" fill="white"/>
  <line x1="80" y1="134" x2="80" y2="170"/>
  <line x1="62" y1="145" x2="98" y2="145"/>
  <line x1="80" y1="170" x2="62" y2="200"/>
  <line x1="80" y1="170" x2="98" y2="200"/>
</g>
<text x="80" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Tulajdonos</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="80" cy="382" r="12" fill="white"/>
  <line x1="80" y1="394" x2="80" y2="430"/>
  <line x1="62" y1="405" x2="98" y2="405"/>
  <line x1="80" y1="430" x2="62" y2="460"/>
  <line x1="80" y1="430" x2="98" y2="460"/>
</g>
<text x="80" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Recepciós</text>

<line x1="98" y1="145" x2="253" y2="300" stroke="black" stroke-width="1.2"/>
<line x1="98" y1="405" x2="253" y2="340" stroke="black" stroke-width="1.2"/>

<ellipse cx="360" cy="320" rx="110" ry="50" fill="white" stroke="black" stroke-width="1.5"/>
<text x="360" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Új tag regisztrálása</text>

<ellipse cx="650" cy="170" rx="150" ry="48" fill="white" stroke="black" stroke-width="1.5"/>
<text x="650" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Tag alapadatainak rögzítése</text>

<ellipse cx="690" cy="320" rx="185" ry="55" fill="white" stroke="black" stroke-width="1.5"/>
<text x="690" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Vészhelyzeti kapcsolattartó rögzítése</text>

<ellipse cx="650" cy="470" rx="140" ry="48" fill="white" stroke="black" stroke-width="1.5"/>
<text x="650" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Bérlet hozzárendelése</text>
<text x="650" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">extension point: sikeres regisztráció után</text>

<path d="M450,290 L525,203" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow)"/>
<text x="487" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«include»</text>

<path d="M460,340 L515,335" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow)"/>
<text x="487" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«include»</text>

<path d="M590,426 L405,366" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow)"/>
<text x="497" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«extend»</text>

<text x="460" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="black">«include» = a regisztráció része, mindig lefut · «extend» = opcionálisan bővíti a regisztrációt</text>
</svg>
