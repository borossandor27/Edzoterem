<svg width="860" height="650" viewBox="0 0 860 650" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Use case diagram – Bérletek kezelése</title>
<desc>A tulajdonos rögzíti és módosítja a bérlettípusokat és árakat; a tulajdonos vagy a recepciós rendel bérletet a taghoz; a lejáró és lejárt bérleteket a rendszer automatikusan jelzi.</desc>
<defs>
  <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="black" stroke-width="1.2"/>
  </marker>
</defs>

<text x="430" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="black">Use case diagram – Bérletek kezelése</text>

<rect x="200" y="55" width="560" height="520" rx="6" fill="none" stroke="black" stroke-width="1.5"/>
<text x="215" y="78" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="black">Bérletek nyilvántartása</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="112" r="12" fill="white"/>
  <line x1="90" y1="124" x2="90" y2="160"/>
  <line x1="72" y1="135" x2="108" y2="135"/>
  <line x1="90" y1="160" x2="72" y2="190"/>
  <line x1="90" y1="160" x2="108" y2="190"/>
</g>
<text x="90" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Tulajdonos</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="312" r="12" fill="white"/>
  <line x1="90" y1="324" x2="90" y2="360"/>
  <line x1="72" y1="335" x2="108" y2="335"/>
  <line x1="90" y1="360" x2="72" y2="390"/>
  <line x1="90" y1="360" x2="108" y2="390"/>
</g>
<text x="90" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Recepciós</text>

<line x1="108" y1="135" x2="265" y2="140" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="135" x2="250" y2="330" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="335" x2="250" y2="330" stroke="black" stroke-width="1.2"/>

<ellipse cx="380" cy="140" rx="115" ry="46" fill="white" stroke="black" stroke-width="1.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">
  <tspan x="380" y="135">Bérlettípus és ár</tspan>
  <tspan x="380" y="153">rögzítése / módosítása</tspan>
</text>

<ellipse cx="380" cy="330" rx="130" ry="44" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Bérlet hozzárendelése taghoz</text>

<ellipse cx="380" cy="500" rx="110" ry="44" fill="white" stroke="black" stroke-width="1.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">
  <tspan x="380" y="495">Lejáró/lejárt bérletek</tspan>
  <tspan x="380" y="513">jelzése</tspan>
</text>
<text x="380" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">automatikusan, időzítve indul – nincs emberi aktor</text>

<text x="430" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="black">A bérlettípus és ár rögzítése kizárólag tulajdonosi jog; a lejárat-jelzés a rendszer önálló, ütemezett funkciója</text>
</svg>
