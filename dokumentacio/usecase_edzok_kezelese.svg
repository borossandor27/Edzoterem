<svg width="860" height="700" viewBox="0 0 860 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Use case diagram – Edzők kezelése</title>
<desc>Az edzőt mint dolgozót csak a tulajdonos veheti fel; az edző megtekintheti a saját órarendjét, rögzítheti a jelenlétet, és adatmódosítási igényt jelezhet a tulajdonos felé.</desc>
<defs>
  <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="black" stroke-width="1.2"/>
  </marker>
</defs>

<text x="430" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="black">Use case diagram – Edzők kezelése</text>

<rect x="200" y="55" width="560" height="580" rx="6" fill="none" stroke="black" stroke-width="1.5"/>
<text x="215" y="78" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="black">Edzők nyilvántartása</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="92" r="12" fill="white"/>
  <line x1="90" y1="104" x2="90" y2="140"/>
  <line x1="72" y1="115" x2="108" y2="115"/>
  <line x1="90" y1="140" x2="72" y2="170"/>
  <line x1="90" y1="140" x2="108" y2="170"/>
</g>
<text x="90" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Tulajdonos</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="362" r="12" fill="white"/>
  <line x1="90" y1="374" x2="90" y2="410"/>
  <line x1="72" y1="385" x2="108" y2="385"/>
  <line x1="90" y1="410" x2="72" y2="440"/>
  <line x1="90" y1="410" x2="108" y2="440"/>
</g>
<text x="90" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Edző</text>

<line x1="108" y1="115" x2="270" y2="110" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="385" x2="250" y2="250" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="385" x2="260" y2="390" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="385" x2="230" y2="530" stroke="black" stroke-width="1.2"/>

<ellipse cx="380" cy="110" rx="110" ry="40" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Edző felvétele</text>
<text x="380" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">az edző mint dolgozó felvétele – ld. Dolgozók kezelése ábra</text>

<ellipse cx="380" cy="250" rx="130" ry="42" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Saját órarend megtekintése</text>

<ellipse cx="380" cy="390" rx="120" ry="42" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Jelenlét rögzítése</text>

<ellipse cx="380" cy="530" rx="150" ry="44" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Adatmódosítási igény jelzése</text>
<text x="380" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">a tulajdonos a Dolgozók kezelése ábra „Dolgozó adatainak</text>
<text x="380" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">módosítása” use case-ével kezeli az igényt</text>

<text x="430" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="black">Az edző a saját óráihoz és jelenlétéhez a webes alkalmazásban fér hozzá</text>
</svg>
