<svg width="920" height="650" viewBox="0 0 920 650" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Use case diagram – Egyéni foglalkozások/szolgáltatások kezelése</title>
<desc>A tulajdonos rögzíti és módosítja az egyéni szolgáltatások típusait; a tulajdonos vagy a recepciós foglal időpontot egy tagnak; a foglalás állapotának (teljesítve/lemondva) frissítését végző aktor a dokumentációban nincs egyértelműen meghatározva.</desc>
<defs>
  <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="black" stroke-width="1.2"/>
  </marker>
</defs>

<text x="460" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="black">Use case diagram – Egyéni foglalkozások/szolgáltatások</text>

<rect x="200" y="55" width="620" height="520" rx="6" fill="none" stroke="black" stroke-width="1.5"/>
<text x="215" y="78" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="black">Egyéni foglalkozások nyilvántartása</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="92" r="12" fill="white"/>
  <line x1="90" y1="104" x2="90" y2="140"/>
  <line x1="72" y1="115" x2="108" y2="115"/>
  <line x1="90" y1="140" x2="72" y2="170"/>
  <line x1="90" y1="140" x2="108" y2="170"/>
</g>
<text x="90" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Tulajdonos</text>

<g stroke="black" stroke-width="1.5" fill="none">
  <circle cx="90" cy="262" r="12" fill="white"/>
  <line x1="90" y1="274" x2="90" y2="310"/>
  <line x1="72" y1="285" x2="108" y2="285"/>
  <line x1="90" y1="310" x2="72" y2="340"/>
  <line x1="90" y1="310" x2="108" y2="340"/>
</g>
<text x="90" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">Recepciós</text>

<line x1="108" y1="115" x2="245" y2="130" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="115" x2="265" y2="300" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="115" x2="250" y2="460" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="285" x2="265" y2="300" stroke="black" stroke-width="1.2"/>
<line x1="108" y1="285" x2="250" y2="460" stroke="black" stroke-width="1.2"/>

<ellipse cx="380" cy="130" rx="135" ry="46" fill="white" stroke="black" stroke-width="1.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">
  <tspan x="380" y="125">Egyéni szolgáltatás típusának</tspan>
  <tspan x="380" y="143">rögzítése / módosítása</tspan>
</text>

<ellipse cx="380" cy="300" rx="115" ry="44" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Foglalás rögzítése tagnak</text>

<ellipse cx="680" cy="280" rx="100" ry="42" fill="white" stroke="black" stroke-width="1.5"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">
  <tspan x="680" y="275">Időpont és szolgáltató</tspan>
  <tspan x="680" y="293">kiválasztása</tspan>
</text>

<ellipse cx="380" cy="460" rx="130" ry="44" fill="white" stroke="black" stroke-width="1.5"/>
<text x="380" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="black">Foglalás állapotának frissítése</text>
<text x="380" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">(teljesítve / lemondva – az aktor a doksiban nincs egyértelműen</text>
<text x="380" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">meghatározva, javaslat: tulajdonos vagy recepciós)</text>

<path d="M485,285 L585,277" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow)"/>
<text x="535" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«include»</text>

<path d="M405,417 L405,343" stroke="black" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#openArrow)"/>
<text x="452" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="black">«extend»</text>

<text x="460" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="black">A szolgáltatás típusát csak a tulajdonos definiálja; a foglalást a tulajdonos vagy a recepciós rögzíti</text>
</svg>
